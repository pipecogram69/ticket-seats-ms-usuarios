services:
  pg-auth:
    image: postgres:16
    container_name: pg-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketseats_auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketseats_auth"]
      interval: 3s
      timeout: 3s
      retries: 15

  ms-usuarios:
    build: .
    container_name: ms-usuarios
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pg-auth:5432/ticketseats_auth
      JWT_SECRET: cambia-esto-en-produccion
    ports:
      - "8001:8001"
    depends_on:
      pg-auth:
        condition: service_healthy

volumes:
  pgdata_auth:
