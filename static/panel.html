<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Seats - Inicio</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
  <main class="main">
    <div class="page-head">
      <h1 id="saludo">Hola 👋</h1>
      <p class="sub">Este es tu resumen en Ticket Seats.</p>
    </div>

    <section class="hero">
      <div>
        <h2>Tu próxima experiencia empieza aquí</h2>
        <p id="hero-txt"></p>
      </div>
      <div class="hero-actions" id="acciones"></div>
    </section>

    <div class="two">
      <section class="box">
        <div class="box-head">
          <h2>📅 Próximos eventos</h2>
          <a href="/static/eventos.html">Ver todos →</a>
        </div>
        <div id="proximos" class="grid-ev mini"></div>
      </section>

      <aside class="stack">
        <section class="box">
          <h2>Mi cuenta</h2>
          <dl class="datos">
            <dt>Rol</dt><dd><span class="badge" id="rol"></span></dd>
            <dt>Correo</dt><dd id="email"></dd>
            <dt>Teléfono</dt><dd id="telefono"></dd>
            <dt>Estado</dt><dd><span class="st VALIDA" id="estado"></span></dd>
          </dl>
        </section>
      </aside>
    </div>

    <section class="box" id="admin" style="display:none;margin-top:22px">
      <h2>Crear usuario</h2>
      <p class="sub">Solo visible para ADMIN. Puedes crear usuarios con cualquier rol.</p>
      <form id="form-crear">
        <div class="row">
          <div><label>Nombre</label><input id="c-nombre" required minlength="2"></div>
          <div><label>Apellido</label><input id="c-apellido" required minlength="2"></div>
        </div>
        <div class="row">
          <div><label>Correo</label><input type="email" id="c-email" required></div>
          <div><label>Contraseña</label><input type="password" id="c-password" required minlength="8" maxlength="72"></div>
        </div>
        <label>Rol</label>
        <select id="c-rol">
          <option>CLIENTE</option><option>ORGANIZADOR</option><option>VALIDADOR</option><option>ADMIN</option>
        </select>
        <button type="submit" class="btn block">Crear usuario</button>
      </form>
      <div id="msg" class="msg"></div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/static/api.js"></script>
  <script>
    const ROLES = {
      ADMIN: { txt: "Administra usuarios, eventos y todo el sistema.",
               acc: [["Crear evento", "/static/crear-evento.html"], ["Gestionar usuarios", "/static/usuarios.html"]] },
      ORGANIZADOR: { txt: "Crea y publica tus eventos con sus localidades y condiciones.",
               acc: [["Crear evento", "/static/crear-evento.html"], ["Ver eventos", "/static/eventos.html"]] },
      CLIENTE: { txt: "Explora los eventos, elige tu asiento y compra tus boletas.",
               acc: [["Explorar eventos", "/static/eventos.html"], ["Mis boletas", "/static/mis-boletas.html"]] },
      VALIDADOR: { txt: "Valida las boletas en el ingreso de los eventos.",
               acc: [["Validar ingreso", "/static/validar.html"], ["Ver eventos", "/static/eventos.html"]] },
    };

    async function proximos() {
      const cont = document.getElementById("proximos");
      try {
        const evs = (await apiEv("/eventos")).filter(e => new Date(e.fecha_inicio) > new Date()).slice(0, 6);
        cont.replaceChildren(...(evs.length ? evs.map(tarjetaEvento)
          : [h("p", { class: "sub" }, "Todavía no hay eventos próximos.")]));
      } catch (e) {
        cont.replaceChildren(h("p", { class: "sub" }, "No se pudieron cargar los eventos."));
      }
    }

    async function cargar() {
      try {
        const u = await api("/auth/me");
        localStorage.setItem("nombre", u.nombre + " " + u.apellido);
        document.getElementById("saludo").textContent = "Hola, " + u.nombre + " 👋";
        document.getElementById("rol").textContent = u.rol;
        document.getElementById("email").textContent = u.email;
        document.getElementById("telefono").textContent = u.telefono || "—";
        document.getElementById("estado").textContent = u.estado;
        const r = ROLES[u.rol] || { txt: "", acc: [] };
        document.getElementById("hero-txt").textContent = r.txt;
        document.getElementById("acciones").replaceChildren(
          ...r.acc.map(([txt, href]) => h("a", { class: "btn light", href }, txt)));
        if (u.rol === "ADMIN") document.getElementById("admin").style.display = "block";
      } catch (err) {
        if (err.status === 401) cerrarSesion();
      }
    }

    document.getElementById("form-crear").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      try {
        const u = await api("/usuarios", "POST", {
          nombre: document.getElementById("c-nombre").value,
          apellido: document.getElementById("c-apellido").value,
          email: document.getElementById("c-email").value,
          password: document.getElementById("c-password").value,
          rol: document.getElementById("c-rol").value,
        });
        mostrar(msg, "Usuario creado: " + u.email + " (" + u.rol + ")", "ok");
        e.target.reset();
      } catch (err) {
        mostrar(msg, err.message, "error");
      }
    });

    cargar();
    proximos();
  </script>
</body>
</html>
