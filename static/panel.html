<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Seats - Panel</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .menu { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .menu a { background: #7c3aed; color: #fff; text-decoration: none; padding: 10px 16px;
              border-radius: 8px; font-weight: 600; font-size: 14px; }
    .menu a:hover { background: #6d28d9; }
    .menu a.sec { background: #ede9fe; color: #5b21b6; }
  </style>
</head>
<body>
  <div class="card wide">
    <div class="header">
      <h1>🎟️ Mi panel</h1>
      <span class="badge" id="rol"></span>
    </div>
    <p class="sub" id="saludo"></p>

    <div class="menu" id="menu">
      <a href="/static/eventos.html">🎟️ Ver eventos</a>
      <a id="m-crear" class="sec" href="/static/crear-evento.html" style="display:none">➕ Crear evento</a>
      <a id="m-usuarios" class="sec" href="/static/usuarios.html" style="display:none">👥 Gestionar usuarios</a>
    </div>

    <div class="info">
      <div><b>Correo:</b> <span id="email"></span></div>
      <div><b>Teléfono:</b> <span id="telefono"></span></div>
      <div><b>Estado:</b> <span id="estado"></span></div>
    </div>

    <div id="contenido-rol" class="section"></div>

    <div id="admin" class="section" style="display:none">
      <h1 style="font-size:18px">Crear usuario</h1>
      <p class="sub">Solo visible para ADMIN</p>
      <form id="form-crear">
        <div class="row">
          <div><label>Nombre</label><input id="c-nombre" required minlength="2"></div>
          <div><label>Apellido</label><input id="c-apellido" required minlength="2"></div>
        </div>
        <label>Correo</label>
        <input type="email" id="c-email" required>
        <div class="row">
          <div><label>Contraseña</label><input type="password" id="c-password" required minlength="8" maxlength="72"></div>
          <div>
            <label>Rol</label>
            <select id="c-rol">
              <option>CLIENTE</option>
              <option>ORGANIZADOR</option>
              <option>VALIDADOR</option>
              <option>ADMIN</option>
            </select>
          </div>
        </div>
        <button type="submit">Crear usuario</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <button class="sec" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <script src="/static/api.js"></script>
  <script>
    const textos = {
      ADMIN: "Eres administrador: gestionas usuarios, roles y puedes crear eventos.",
      ORGANIZADOR: "Crea y publica tus eventos con sus localidades y condiciones comerciales.",
      CLIENTE: "Explora los eventos publicados y reserva tus asientos.",
      VALIDADOR: "Aquí validarás las boletas en el ingreso al evento (próximo microservicio).",
    };

    async function cargar() {
      if (!localStorage.getItem("token")) return location.href = "/static/login.html";
      try {
        const u = await api("/auth/me");
        document.getElementById("rol").textContent = u.rol;
        document.getElementById("saludo").textContent = "Hola, " + u.nombre + " " + u.apellido;
        document.getElementById("email").textContent = u.email;
        document.getElementById("telefono").textContent = u.telefono || "—";
        document.getElementById("estado").textContent = u.estado;
        document.getElementById("contenido-rol").textContent = textos[u.rol] || "";
        if (u.rol === "ADMIN" || u.rol === "ORGANIZADOR") document.getElementById("m-crear").style.display = "inline-block";
        if (u.rol === "ADMIN") {
          document.getElementById("m-usuarios").style.display = "inline-block";
          document.getElementById("admin").style.display = "block";
        }
      } catch (err) {
        if (err.status === 401) cerrarSesion();
      }
    }

    document.getElementById("form-crear").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      try {
        const u = await api("/usuarios", "POST", {
          nombre: document.getElementById("c-nombre").value,
          apellido: document.getElementById("c-apellido").value,
          email: document.getElementById("c-email").value,
          password: document.getElementById("c-password").value,
          rol: document.getElementById("c-rol").value,
        });
        mostrar(msg, "Usuario creado: " + u.email + " (" + u.rol + ")", "ok");
        e.target.reset();
      } catch (err) {
        mostrar(msg, err.message, "error");
      }
    });

    cargar();
  </script>
</body>
</html>
