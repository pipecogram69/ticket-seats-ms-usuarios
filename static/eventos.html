<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Seats - Eventos</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
  <main class="main">
    <div class="page-head">
      <h1>Eventos</h1>
      <p class="sub">Descubre lo que viene. Cada ciudad vive en un shard distinto.</p>
    </div>

    <section class="box">
      <div class="filtros">
        <div><label>Ciudad</label><select id="f-ciudad"><option value="">Todas</option></select></div>
        <div style="flex:2 1 260px"><label>Buscar</label><input id="q" placeholder="nombre del evento"></div>
        <button id="buscar" class="btn">Buscar</button>
      </div>
    </section>

    <div id="msg" class="msg"></div>
    <div id="lista" class="grid-ev" style="margin-top:22px"></div>

    <section id="shards" class="box" style="display:none;margin-top:28px"></section>
  </main>

  <script src="/config.js"></script>
  <script src="/static/api.js"></script>
  <script>
    const rol = localStorage.getItem("rol");
    const msg = document.getElementById("msg");

    async function cargar() {
      const p = new URLSearchParams();
      const c = document.getElementById("f-ciudad").value;
      const q = document.getElementById("q").value.trim();
      if (c) p.set("id_ciudad", c);
      if (q) p.set("q", q);
      const evs = await apiEv("/eventos?" + p.toString());
      document.getElementById("lista").replaceChildren(...(evs.length ? evs.map(tarjetaEvento)
        : [h("p", { class: "sub" }, "No hay eventos publicados.")]));
    }

    async function cargarShards() {
      const s = await apiEv("/shards");
      const box = document.getElementById("shards");
      box.style.display = "block";
      box.replaceChildren(
        h("h2", {}, "🧩 Estado de los shards"),
        h("p", { class: "sub" }, "Solo visible para ADMIN"),
        h("div", { class: "shards" }, ...s.map(x => h("div", { class: "shard" },
          h("b", {}, "Shard " + x.id_shard),
          h("small", {}, x.ciudades.join(", ")),
          h("span", {}, x.eventos + " eventos"),
          h("span", {}, "Boletas: " + (Object.entries(x.boletas).map(([k, v]) => `${k.toLowerCase()} ${v}`).join(" · ") || "—"))))));
    }

    async function iniciar() {
      try {
        const ciudades = await apiEv("/ciudades");
        const sel = document.getElementById("f-ciudad");
        for (const c of ciudades) sel.add(new Option(`${c.nombre} (shard ${c.id_shard})`, c.id_ciudad));
        await cargar();
        if (rol === "ADMIN") await cargarShards();
      } catch (e) {
        if (e.status === 401) cerrarSesion(); else mostrar(msg, e.message, "error");
      }
    }

    document.getElementById("buscar").addEventListener("click", () => cargar().catch(e => mostrar(msg, e.message, "error")));
    iniciar();
  </script>
</body>
</html>
