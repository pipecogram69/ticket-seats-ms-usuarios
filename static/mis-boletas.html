<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Seats - Mis boletas</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
  <main class="main">
    <div class="page-head">
      <h1>Mis boletas</h1>
      <p class="sub">Presenta el código QR (o el código escrito) en el ingreso del evento.</p>
    </div>

    <div id="msg" class="msg" style="margin-bottom:20px"></div>
    <div id="boletas" class="grid-tk"></div>

    <section class="box" style="margin-top:30px">
      <h2>Mis órdenes</h2>
      <div id="ordenes"></div>
    </section>
  </main>

  <script src="/static/api.js"></script>
  <script>
    const msg = document.getElementById("msg");

    function tarjeta(b) {
      return h("article", { class: "tk" },
        imgEvento(b.imagen_url, 120),
        h("div", { class: "tk-body" },
          h("div", { class: "tk-top" },
            h("span", { class: "st " + b.estado }, b.estado === "VALIDA" ? "VÁLIDA" : b.estado === "ANULADA" ? "DEVUELTA" : b.estado),
            h("small", {}, fmtPrecio(b.precio))),
          h("h3", {}, b.evento_nombre),
          h("p", { class: "meta" }, `📍 ${b.venue || ""} · ${b.ciudad || ""}`),
          h("p", { class: "meta" }, "🗓️ " + fmtFecha(b.evento_fecha)),
          h("div", { class: "asiento" }, h("span", {}, b.localidad), h("b", {}, `Fila ${b.fila} · Asiento ${b.asiento}`))),
        h("div", { class: "tk-qr" },
          h("img", { class: "qr", src: b.qr, alt: "Código QR de ingreso" }),
          h("p", { class: "codigo" }, b.codigo),
          h("p", { class: "meta c" }, b.estado === "USADA" ? "Usada el " + fmtFecha(b.usada_en) : "Presenta este código en el ingreso"),
          b.estado === "VALIDA" ? h("button", { class: "btn sec sm", style: "margin-top:10px", onclick: () => devolver(b.id_emitida) }, "Solicitar devolución") : null));
    }

    async function devolver(id) {
      if (!confirm("¿Solicitar la devolución de esta boleta? Si el evento lo permite, el asiento se libera y se te reembolsa su valor.")) return;
      try {
        const r = await apiOrd(`/boletas/${id}/devolver`, "POST", {});
        mostrar(msg, "Devolución aprobada: " + fmtPrecio(r.monto) + " reembolsados.", "ok");
        await cargar();
      } catch (e) { mostrar(msg, e.message, "error"); }
    }

    async function cargar() {
      if (new URLSearchParams(location.search).get("nueva"))
        mostrar(msg, "¡Pago aprobado! Estas son tus boletas.", "ok");
      try {
        const [boletas, ordenes] = await Promise.all([apiOrd("/boletas/mias"), apiOrd("/ordenes/mias")]);
        document.getElementById("boletas").replaceChildren(...(boletas.length ? boletas.map(tarjeta)
          : [h("p", { class: "sub" }, "Aún no tienes boletas compradas.")]));
        document.getElementById("ordenes").replaceChildren(...(ordenes.length ? ordenes.map(o =>
          h("div", { class: "ord" },
            h("span", {}, `${fmtFecha(o.created_at)} · ${o.evento_nombre}`),
            h("span", {}, `${fmtPrecio(o.total)} · ${o.estado} `,
              o.estado === "PENDIENTE_PAGO" ? h("a", { href: "/static/pagar.html?orden=" + o.id_orden }, "Pagar") : null)))
          : [h("p", { class: "sub" }, "Sin órdenes.")]));
      } catch (e) {
        if (e.status === 401) cerrarSesion(); else mostrar(msg, e.message, "error");
      }
    }
    cargar();
  </script>
</body>
</html>
