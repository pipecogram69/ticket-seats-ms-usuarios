<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Seats - Evento</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="app">
  <main class="main">
    <div class="page-head">
      <a class="volver" href="/static/eventos.html">← Volver a eventos</a>
      <h1 id="titulo">Evento</h1>
      <p class="sub" id="detalle"></p>
    </div>

    <section class="box evento-top">
      <div id="banner"></div>
      <p class="sub" id="condiciones"></p>
    </section>

    <div id="msg" class="msg"></div>

    <div class="layout">
      <section class="box">
        <div class="leyenda">
          <span class="l-libre">Disponible</span><span class="l-sel">Tu selección</span>
          <span class="l-mio">Tu reserva</span><span class="l-oc">Ocupado</span>
        </div>
        <div id="mapa"></div>
      </section>
      <aside class="box" id="panel"></aside>
    </div>
  </main>

  <script src="/config.js"></script>
  <script src="/static/api.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const msg = document.getElementById("msg");
    const rol = localStorage.getItem("rol");
    let ev = null, boletas = [], reserva = null, timer = null;
    const sel = new Map();

    async function cargar() {
      ev = await apiEv("/eventos/" + id);
      boletas = await apiEv(`/eventos/${id}/boletas`);
      sel.clear();
      pintarCabecera();
      pintarMapa();
      pintarPanel();
    }

    function puedeComprar() {
      return ["CLIENTE", "ADMIN"].includes(rol) && ev && ev.estado === "PUBLICADO";
    }

    function pintarCabecera() {
      document.getElementById("titulo").textContent = ev.nombre;
      document.getElementById("banner").replaceChildren(imgEvento(ev.imagen_url, 240));
      document.getElementById("detalle").textContent =
        `${ev.ciudad} · ${ev.venue} · ${fmtFecha(ev.fecha_inicio)} · shard ${ev.id_shard} · ${ev.estado}`;
      const c = ev.condiciones || {};
      document.getElementById("condiciones").textContent =
        `Máx. ${c.max_boletas_por_compra ?? 6} boletas por compra · reserva de ${c.minutos_reserva ?? 10} min` +
        (Number(c.cargo_servicio_pct) ? ` · cargo de servicio ${c.cargo_servicio_pct}%` : "");
    }

    function botonAsiento(b) {
      const libre = b.estado === "DISPONIBLE";
      const mio = reserva && reserva.reservadas.some(r => r.id_boleta === b.id_boleta);
      const btn = h("button", { type: "button", class: "seat " + (mio ? "mio" : libre ? "libre" : "ocupado"),
                                title: `${b.fila}${b.asiento} · ${mio ? "TU RESERVA" : b.estado}` }, String(b.asiento));
      if (!libre || !puedeComprar() || reserva) {
        btn.disabled = true;
      } else {
        btn.addEventListener("click", () => {
          if (sel.has(b.id_boleta)) { sel.delete(b.id_boleta); btn.classList.remove("sel"); }
          else { sel.set(b.id_boleta, b); btn.classList.add("sel"); }
          pintarPanel();
        });
      }
      return btn;
    }

    function pintarMapa() {
      const mapa = document.getElementById("mapa");
      mapa.replaceChildren();
      const grupos = new Map();
      for (const b of boletas) {
        if (!grupos.has(b.id_localidad)) grupos.set(b.id_localidad, { nombre: b.localidad, precio: b.precio, filas: new Map() });
        const g = grupos.get(b.id_localidad);
        if (!g.filas.has(b.fila)) g.filas.set(b.fila, []);
        g.filas.get(b.fila).push(b);
      }
      for (const [idLoc, g] of grupos) {
        const info = (ev.localidades || []).find(l => l.id_localidad === idLoc);
        mapa.append(h("h3", { class: "loc" },
          `${g.nombre} — ${fmtPrecio(g.precio)}` + (info ? ` · ${info.disponibles} disponibles` : "")));
        for (const [fila, asientos] of g.filas) {
          const row = h("div", { class: "fila" }, h("span", { class: "lbl" }, fila));
          for (const b of asientos) row.append(botonAsiento(b));
          mapa.append(row);
        }
      }
    }

    function linea(txt, valor, clase = "") {
      return h("div", { class: "linea " + clase }, h("span", {}, txt), h("b", {}, valor));
    }

    function pintarPanel() {
      const p = document.getElementById("panel");
      p.replaceChildren();
      if (!puedeComprar()) {
        p.append(h("h2", {}, "Reserva"), h("p", { class: "sub" }, ev.estado !== "PUBLICADO"
          ? "Este evento no está disponible para la venta."
          : "Solo los clientes pueden reservar boletas."));
        return;
      }
      if (reserva) {
        p.append(
          h("h2", {}, "Reserva activa"),
          h("div", { class: "lineas" },
            ...reserva.reservadas.map(r => linea(`${r.localidad} · ${r.fila}${r.asiento}`, fmtPrecio(r.precio))),
            linea("Subtotal", fmtPrecio(reserva.subtotal)),
            linea("Cargo de servicio", fmtPrecio(reserva.cargo_servicio)),
            linea("Total", fmtPrecio(reserva.total), "total")),
          h("p", { id: "cuenta", class: "cuenta" }, ""),
          h("button", { class: "btn block", onclick: irAPagar }, "Ir a pagar"),
          h("button", { class: "btn sec block", onclick: liberar }, "Liberar boletas"));
        return;
      }
      const lista = [...sel.values()];
      const total = lista.reduce((a, b) => a + Number(b.precio), 0);
      p.append(
        h("h2", {}, "Tu selección"),
        h("div", { class: "lineas" },
          ...(lista.length ? lista.map(b => linea(`${b.localidad} · ${b.fila}${b.asiento}`, fmtPrecio(b.precio)))
            : [h("p", { class: "sub" }, "Elige asientos en el mapa.")]),
          linea("Subtotal", fmtPrecio(total), "total")),
        h("button", Object.assign({ class: "btn block", onclick: reservar }, lista.length ? {} : { disabled: "" }), "Reservar"));
    }

    async function reservar() {
      try {
        const body = { id_evento: id, boletas: [...sel.values()].map(b => ({ id_boleta: b.id_boleta, version: b.version })) };
        reserva = await api("/reservas", "POST", body);
        mostrar(msg, "Boletas reservadas. Paga antes de que se agote el tiempo.", "ok");
        iniciarCuenta();
        boletas = await apiEv(`/eventos/${id}/boletas`);
        pintarMapa();
        pintarPanel();
      } catch (e) {
        mostrar(msg, e.message, "error");
        if (e.status === 409) await cargar();
      }
    }

    async function irAPagar() {
      try {
        const o = await apiOrd("/ordenes", "POST", { id_evento: id });
        clearInterval(timer);
        location.href = "/static/pagar.html?orden=" + o.id_orden;
      } catch (e) {
        mostrar(msg, e.message, "error");
      }
    }

    async function liberar() {
      try {
        await api("/reservas/" + reserva.id_reserva + "/cancelar", "POST");
        clearInterval(timer);
        reserva = null;
        await cargar();
        mostrar(msg, "Boletas liberadas.", "ok");
      } catch (e) {
        mostrar(msg, e.message, "error");
      }
    }

    function iniciarCuenta() {
      clearInterval(timer);
      const fin = new Date(reserva.expira_en).getTime();
      timer = setInterval(async () => {
        const s = Math.floor((fin - Date.now()) / 1000);
        if (s <= 0) {
          clearInterval(timer);
          reserva = null;
          await cargar();
          mostrar(msg, "La reserva expiró y las boletas se liberaron.", "error");
          return;
        }
        const c = document.getElementById("cuenta");
        if (c) c.textContent = `⏱ Expira en ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }, 1000);
    }

    async function iniciar() {
      if (!id) return location.href = "/static/eventos.html";
      try { await cargar(); }
      catch (e) { if (e.status === 401) cerrarSesion(); else mostrar(msg, e.message, "error"); }
    }
    iniciar();
  </script>
</body>
</html>
